<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MindCare | Recuperar contraseña</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet"
          href="css/recuperar.css?v=2">
    <link rel="stylesheet"
          href="css/mindcare-pages-pro.css?v=1">
    <link rel="stylesheet" href="css/mindcare-refresh.css?v=1">

</head>

<body>

    <div class="recover-wrap">

        <div class="recover-card">

            <div class="logo-circle">
                <i class="fa-solid fa-shield-heart"></i>
            </div>

            <h1>Recuperar contraseña</h1>

            <p class="subtitle">
                Restablece el acceso a tu cuenta MindCare.
            </p>

            <!-- PASO 1 -->
            <div id="paso1">

                <div class="form-group">
                    <label>
                        <i class="fa-solid fa-envelope"></i>
                        Correo electrónico
                    </label>

                    <input type="email"
                           id="email"
                           placeholder="ejemplo@correo.com"
                           autocomplete="email"
                           maxlength="254"
                           required>
                </div>

                <button id="enviarCodigoBtn"
                        type="button"
                        onclick="enviarCodigo()"
                        class="btn-main">

                    <i class="fa-solid fa-paper-plane"></i>
                    Enviar código

                </button>

            </div>

            <!-- PASO 2 -->
            <div id="paso2" style="display:none;">

                <div class="form-group">
                    <label>
                        <i class="fa-solid fa-key"></i>
                        Código recibido
                    </label>

                    <input type="text"
                           id="codigo"
                           placeholder="123456"
                           inputmode="numeric"
                           autocomplete="one-time-code"
                           maxlength="6"
                           pattern="[0-9]{6}">
                </div>

                <div class="form-group">
                    <label>
                        <i class="fa-solid fa-lock"></i>
                        Nueva contraseña
                    </label>

                    <input type="password"
                           id="password"
                           placeholder="Mínimo 10 caracteres"
                           autocomplete="new-password"
                           minlength="10">
                </div>

                <div class="form-group">
                    <label>
                        <i class="fa-solid fa-lock"></i>
                        Confirmar contraseña
                    </label>

                    <input type="password"
                           id="confirmarPassword"
                           placeholder="Repite la nueva contraseña"
                           autocomplete="new-password"
                           minlength="10">
                </div>

                <button id="cambiarPasswordBtn"
                        type="button"
                        onclick="cambiarPassword()"
                        class="btn-main">

                    <i class="fa-solid fa-rotate"></i>
                    Actualizar contraseña

                </button>

            </div>

            <p id="mensaje" role="status" aria-live="polite"></p>

            <a href="login.html"
               class="back-link">

                <i class="fa-solid fa-arrow-left"></i>
                Volver al login

            </a>

        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/recuperar.js?v=3"></script>
    <div id="toast"></div>

</body>
</html>
