<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MindCare | Alta Psicólogos</title>

    <!-- ICONOS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="../css/adminPsicologos.css?v=2">
    <link rel="stylesheet"
          href="../css/mindcare-pages-pro.css?v=1">
    <link rel="stylesheet" href="../css/mindcare-refresh.css?v=1">

</head>

<body>

    <div class="page">

        <div class="card">

            <!-- ICONO -->
            <div class="hero">

                <i class="fa-solid fa-user-doctor"></i>

            </div>

            <!-- TITULO -->
            <h1>Alta de Psicólogos</h1>

            <p class="sub">

                Registra los datos necesarios para iniciar la verificación profesional.

            </p>

            <!-- FORM -->

            <input id="nombre"
                   placeholder="Nombre(s)" autocomplete="given-name">

            <input id="apellidoPaterno"
                   placeholder="Apellido paterno" autocomplete="family-name">

            <input id="apellidoMaterno"
                   placeholder="Apellido materno">

            <input id="email" type="email"
                   placeholder="Correo electrónico">

            <input id="password" type="password" minlength="10"
                   placeholder="Contraseña temporal (mínimo 10 caracteres)">

            <input id="telefono"
                   placeholder="Teléfono">

            <input id="zona"
                   placeholder="Zona">

            <input id="cedula" inputmode="numeric"
                   placeholder="Número de cédula profesional">

            <input id="institucion"
                   placeholder="Institución de procedencia">

            <input id="especialidad"
                   placeholder="Especialidad">

            <input id="experiencia" type="number" min="0" max="80"
                   placeholder="Años de experiencia (opcional)">

            <label class="consent-check">
                <input id="aceptaTerminos" type="checkbox">
                Confirmo la captura de los datos profesionales para su revisión.
            </label>

            <!-- BOTÓN -->

            <button class="guardar"
                    onclick="registrarPsicologo()">

                <i class="fa-solid fa-user-plus"></i>
                Registrar Psicólogo

            </button>

            <p id="msg"></p>

            <!-- VOLVER -->

            <button class="volver"
                    onclick="window.location.href='../admin.html'">

                <i class="fa-solid fa-arrow-left"></i>
                Volver al panel administrativo

            </button>

        </div>

    </div>

    <!-- JS -->
    <script src="../js/config.js"></script>
    <script src="../js/adminPsicologos.js?v=2"></script>
    <div id="toast"></div>

</body>
</html>
